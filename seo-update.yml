name: SEO pages update

on:
  schedule:
    - cron: '30 20 * * *'   # roz raat ~2:00 AM India time
  workflow_dispatch:         # manual "Run workflow" button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate SEO pages
        run: node generate-seo.js
      - name: Commit changes
        run: |
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto SEO update"
            git push
          fi
